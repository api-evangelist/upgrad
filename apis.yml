apis:
- name: upGrad Partner Service API
  description: 'Channel-partner operations API for upGrad''s referral and franchise network: partner onboarding
    and KYC document upload/verification, prospect (lead) capture and status transitions, store and team-member
    hierarchy management, commission rules, and partner invoice / credit-note reporting. 54 operations across 46
    paths, secured by an AUTH-TOKEN API key header. The springdoc-generated OpenAPI is served anonymously at https://partner.upgrad.com/api-docs
    while every operation itself requires credentials.'
  humanURL: https://partner.upgrad.com/api-docs
  baseURL: https://partner.upgrad.com
  tags:
  - Partner Management
  - Referrals
  - Commissions
  - Invoicing
  - Education
  properties:
  - type: OpenAPI
    url: openapi/upgrad-partner-openapi.yml
  - type: OpenAPI
    url: openapi/_original/upgrad-partner-openapi-original.json
    name: Verbatim harvest
  - type: Overlay
    url: overlays/upgrad-partner-overlay.yaml
  - type: Authentication
    url: authentication/upgrad-authentication.yml
  - type: ErrorCatalog
    url: errors/upgrad-problem-types.yml
  - type: DataModel
    url: data-model/upgrad-data-model.yml
- name: upGrad Learner Experience Analytics API
  description: 'Learner-experience analytics service behind upGrad''s learning platform: daily reading-time leaderboards
    per course and per user, micro-interaction notification records, and administrative cache eviction for student
    profiles. 6 operations across 6 paths, declaring an HTTP bearer (JWT) security scheme. The springdoc-generated
    OpenAPI is served anonymously at https://learner-analytics-rest.upgrad.com/api-docs.'
  humanURL: https://learner-analytics-rest.upgrad.com/api-docs
  baseURL: https://learner-analytics-rest.upgrad.com
  tags:
  - Learning Analytics
  - Leaderboards
  - Notifications
  - Education
  properties:
  - type: OpenAPI
    url: openapi/upgrad-learner-analytics-openapi.yml
  - type: OpenAPI

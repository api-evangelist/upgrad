aid: upgrad
name: upGrad
description: 'upGrad is an online higher-education and workforce-upskilling platform headquartered in Mumbai, India,
  founded in 2015 by Ronnie Screwvala, Mayank Kumar and Phalgun Kompalli. It delivers degrees, executive certifications,
  bootcamps and doctoral programmes in partnership with global universities including Liverpool John Moores University,
  Golden Gate University, O.P. Jindal Global University, IIIT Bangalore, IIM Kozhikode and IIT Kharagpur, alongside
  a study-abroad advisory business covering the USA, UK, Canada, Australia, Germany and Ireland. Its public API
  surface is not a marketed developer programme: it is a large internal microservice estate on upgrad.com subdomains,
  of which two Spring Boot services publish their springdoc OpenAPI 3.0.1 documents anonymously at /api-docs — a
  Partner Service covering channel-partner onboarding, prospects, stores, team hierarchy, commission rules and partner
  invoicing/credit notes, and a Learner Experience Analytics service covering reading-time leaderboards and micro-interaction
  notifications.'

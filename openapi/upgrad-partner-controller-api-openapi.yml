        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponsePartnerDto'
      summary: Get partners
      x-summary-source: derived
components:
  schemas:
    PartnerBaseDto:
      required:
      - email
      - mobile
      - postalCode
      type: object
      properties:
        addressLine:
          type: string
        city:
          type: string
        state:
          type: integer
          format: int64
        landmark:
          type: string
        postalCode:
          type: integer
          format: int32
        invalidStatus:
          type: boolean
        stateName:
          type: string
        userId:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        mobile:
          maximum: 10
          minimum: 0
          type: integer
          format: int64
        businessName:
          type: string
        authorisedSignatory:
          type: string
        businessType:
          type: string
        partnershipType:
          type: string
          enum:
          - CHANNEL_PARTNER
          - FREELANCER
          - FRANCHISE
          - STUDY_ABROAD
          - LC_PARTNER
        sapCode:
          pattern: ^[0-9]{10,11}$
          type: string
    Predicate:
      type: object
    PageResponsePartnerDto:
      type: object
      properties:
        total:
          type: integer
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartnerDto'
    PartnerDto:
      required:
      - email
      - mobile
      - postalCode
      type: object
      properties:
        addressLine:
          type: string
        city:
          type: string
        state:
          type: integer
          format: int64
        landmark:
          type: string
        postalCode:
          type: integer
          format: int32
        invalidStatus:
          type: boolean
        stateName:
          type: string
        userId:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        mobile:
          maximum: 10
          minimum: 0
          type: integer
          format: int64
        businessName:
          type: string
        authorisedSignatory:
          type: string
        businessType:
          type: string
        partnershipType:
          type: string
          enum:
          - CHANNEL_PARTNER
          - FREELANCER
          - FRANCHISE
          - STUDY_ABROAD
          - LC_PARTNER
        sapCode:
          pattern: ^[0-9]{10,11}$
          type: string
        partnerStages:
          type: array
          items:
            $ref: '#/components/schemas/PartnerStageDto'
        regionalManagerId:
          type: integer
          format: int64
        dateOfRegistration:
          type: string
          format: date-time
        partnerDocuments:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DocumentResponse'
        regionalManagerEmail:
          type: string
        regionalManagerPhone:
          type: integer
          format: int64
        partnerStatusSummary:
          $ref: '#/components/schemas/PartnerStatusSummary'
        regionalManagerFullName:
          type: string
        loggedRmId:
          type: integer
          format: int64
    ErrorContext:
      type: object
      properties:
        errorCode:
          type: string
        messages:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties:
            type: object
    PartnerStageDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        comment:
          type: string
        status:
          $ref: '#/components/schemas/StatusDto'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        signDate:
          type: string
          format: date
    StatusDto:
      type: object
      properties:
        label:
          type: string
        id:
          type: integer
          format: int64
        type:
          type: string
    PartnerStatusSummary:
      type: object
      properties:
        registration:
          type: string
        document:
          type: string
        agreement:
          type: string
        dmsUploadId:
          type: string
    CoPartnerDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mobile:
          type: string
        type:
          type: string
    DocumentResponse:
      type: object
      properties:
        coPartner:
          $ref: '#/components/schemas/CoPartnerDto'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDto'
        status:
          type: string
    UpdateRmIdDto:
      type: object
      properties:
        rmId:
          type: integer
          format: int64
        partnerId:
          type: array
          items:
            type: integer
            format: int64
    DocumentDto:
      type: object
      properties:
        docAttributes:
          type: object
          additionalProperties:
            type: string
        documentConfigCode:
          type: string
        status:
          type: integer
          format: int64
        dmsUploadId:
          type: string
        statusLabel:
          type: string
        comments:
          type: string
        fileLabel:
          type: string
        documentUrl:
          type: string
    Pageable:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          format: int32
        size:
          minimum: 1
          type: integer
          format: int32
        sort:
          type: array
          items:
            type: string
  securitySchemes:
    AUTH-TOKEN:
      type: apiKey
      name: AUTH-TOKEN
      in: header

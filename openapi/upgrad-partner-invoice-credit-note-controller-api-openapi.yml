        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorContext'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorContext'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorContext'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PartnerInvoiceCreditNoteDashboardDto'
      summary: Get partner invoice credit note dashboard
      x-summary-source: derived
components:
  schemas:
    InvoiceStatusFlowDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        disposition:
          type: string
        status:
          type: string
        type:
          type: string
    Predicate:
      type: object
    PartnerInvoiceCreditNoteReportDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        partnerId:
          type: integer
          format: int64
        vendorName:
          type: string
        vendorType:
          type: string
        gstNumber:
          type: string
        type:
          type: string
        invoiceNoteNumber:
          type: string
        parentStatus:
          type: string
        parentDisposition:
          type: string
        created:
          type: string
          format: date
        childStatus:
          type: string
        childDisposition:
          type: string
        amount:
          type: number
          format: double
        totalWithoutTax:
          type: number
          format: double
        totalGst:
          type: number
          format: double
        dateOfApproval:
          type: string
          format: date
        releaseDate:
          type: string
          format: date
        receivedDate:
          type: string
          format: date
        parentPartnerInvoiceStatusFlowId:
          type: integer
          format: int64
        childPartnerInvoiceStatusFlowId:
          type: integer
          format: int64
        dmsUploadId:
          type: string
        lastUpdatedById:
          type: integer
          format: int64
        lastApprovedById:
          type: integer
          format: int64
        month:
          type: integer
          format: int32
        year:
          type: integer
          format: int32
    PageResponsePartnerInvoiceCreditNoteReportDto:
      type: object
      properties:
        total:
          type: integer
          format: int64
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartnerInvoiceCreditNoteReportDto'
    PartnerInvoiceCreditNoteDashboardDto:
      type: object
      properties:
        type:
          type: string
        outStandingAmount:
          type: number
          format: double
        reports:
          type: array
          items:
            $ref: '#/components/schemas/PartnerInvoiceCreditNoteReportDto'
    ErrorContext:
      type: object
      properties:
        errorCode:
          type: string
        messages:
          type: array
          items:
            type: string
        data:
          type: object
          additionalProperties:
            type: object
    UserUploadedEventTempUrlDto:
      type: object
      properties:
        tempUrl:
          type: string
    Pageable:
      type: object
      properties:
        page:
          minimum: 0
          type: integer
          format: int32
        size:
          minimum: 1
          type: integer
          format: int32
        sort:
          type: array
          items:
            type: string
  securitySchemes:
    AUTH-TOKEN:
      type: apiKey
      name: AUTH-TOKEN
      in: header
